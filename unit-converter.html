<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter | Naveen Siriwardhana</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">

    <style>
        :root {
            --bg-color: #0a192f;
            --text-main: #ffffff;
            --text-sub: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --inner-box: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(16, 185, 129, 0.05);
            --input-bg: rgba(10, 25, 47, 0.7);
        }

        html.light {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(15, 23, 42, 0.08);
            --inner-box: rgba(15, 23, 42, 0.04);
            --grid-color: rgba(16, 185, 129, 0.08);
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }

        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, var(--grid-color) 1px, transparent 0);
            background-size: 30px 30px;
        }

        .tab-btn.active {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="grid-bg min-h-screen py-12 px-4 md:px-8">

    <div class="max-w-2xl mx-auto container">

        <!-- Navigation & Theme Toggle -->
        <div class="flex justify-between items-center mb-8">
            <a href="index.html" class="glass-card px-4 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Profile
            </a>
            <button id="theme-toggle" class="glass-card p-3 rounded-xl text-emerald-400 hover:text-emerald-300 focus:outline-none cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>

        <!-- Tool Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-3xl text-emerald-400"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-main);">Unit Converter</h1>
                    <p class="text-xs mono uppercase tracking-wider text-emerald-400">// Length · Weight · Data · Currency</p>
                </div>
            </div>

            <hr class="border-emerald-500/10 mb-6">

            <!-- Category Tabs -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
                <button data-cat="length" class="tab-btn active px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500/10 transition-all cursor-pointer" style="background: var(--inner-box); color: var(--text-sub);">
                    <i class="fa-solid fa-ruler mr-1"></i> Length
                </button>
                <button data-cat="weight" class="tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500/10 transition-all cursor-pointer" style="background: var(--inner-box); color: var(--text-sub);">
                    <i class="fa-solid fa-weight-hanging mr-1"></i> Weight
                </button>
                <button data-cat="data" class="tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500/10 transition-all cursor-pointer" style="background: var(--inner-box); color: var(--text-sub);">
                    <i class="fa-solid fa-database mr-1"></i> Data
                </button>
                <button data-cat="currency" class="tab-btn px-3 py-2 rounded-xl text-xs font-bold border border-emerald-500/10 transition-all cursor-pointer" style="background: var(--inner-box); color: var(--text-sub);">
                    <i class="fa-solid fa-money-bill-wave mr-1"></i> Currency
                </button>
            </div>

            <!-- Converter Inputs -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-main);">From</label>
                    <div class="flex gap-2">
                        <input type="number" id="input-value" value="1" class="w-full p-3 rounded-xl border border-emerald-500/20 focus:border-emerald-400 focus:outline-none mono text-center" style="background: var(--input-bg); color: var(--text-main);">
                        <select id="from-unit" class="p-3 rounded-xl border border-emerald-500/20 focus:border-emerald-400 focus:outline-none font-semibold cursor-pointer min-w-[110px]" style="background: var(--input-bg); color: var(--text-main);"></select>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button id="swap-btn" class="w-10 h-10 rounded-full bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20 transition-all cursor-pointer">
                        <i class="fa-solid fa-arrow-down-up-across-line"></i>
                    </button>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-main);">To</label>
                    <div class="flex gap-2">
                        <input type="text" id="output-value" readonly class="w-full p-3 rounded-xl border border-emerald-500/20 mono text-center font-bold text-emerald-400" style="background: var(--input-bg);">
                        <select id="to-unit" class="p-3 rounded-xl border border-emerald-500/20 focus:border-emerald-400 focus:outline-none font-semibold cursor-pointer min-w-[110px]" style="background: var(--input-bg); color: var(--text-main);"></select>
                    </div>
                </div>
            </div>

            <p id="note" class="text-[11px] text-center mt-6" style="color: var(--text-muted);"></p>
        </div>
    </div>

    <script>
        const units = {
            length: {
                base: 'm',
                factors: { mm: 0.001, cm: 0.01, m: 1, km: 1000, inch: 0.0254, ft: 0.3048, yard: 0.9144, mile: 1609.344 },
                note: "Length conversions are exact, based on the metric/imperial standard."
            },
            weight: {
                base: 'kg',
                factors: { mg: 0.000001, g: 0.001, kg: 1, ton: 1000, lb: 0.45359237, oz: 0.028349523125 },
                note: "Weight conversions use standard avoirdupois values."
            },
            data: {
                base: 'MB',
                factors: { Bit: 1 / (8 * 1024 * 1024), Byte: 1 / (1024 * 1024), KB: 1 / 1024, MB: 1, GB: 1024, TB: 1024 * 1024 },
                note: "Data conversions use binary units (1 KB = 1024 Bytes)."
            },
            currency: {
                base: 'USD',
                // Approximate static reference rates (base = 1 USD). Update manually for accuracy.
                factors: { USD: 1, LKR: 300, EUR: 0.92, GBP: 0.78, INR: 83.5, AUD: 1.5 },
                note: "Currency rates are approximate reference values, not live market rates."
            }
        };

        let currentCategory = 'length';

        const fromUnitSelect = document.getElementById('from-unit');
        const toUnitSelect = document.getElementById('to-unit');
        const inputValue = document.getElementById('input-value');
        const outputValue = document.getElementById('output-value');
        const note = document.getElementById('note');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const swapBtn = document.getElementById('swap-btn');

        function populateUnits(category) {
            const unitKeys = Object.keys(units[category].factors);
            fromUnitSelect.innerHTML = unitKeys.map(u => `<option value="${u}">${u}</option>`).join('');
            toUnitSelect.innerHTML = unitKeys.map(u => `<option value="${u}">${u}</option>`).join('');
            fromUnitSelect.selectedIndex = 0;
            toUnitSelect.selectedIndex = unitKeys.length > 1 ? 1 : 0;
            note.textContent = units[category].note;
        }

        function convert() {
            const category = units[currentCategory];
            const val = parseFloat(inputValue.value) || 0;
            const fromFactor = category.factors[fromUnitSelect.value];
            const toFactor = category.factors[toUnitSelect.value];

            const baseValue = val * fromFactor;
            const result = baseValue / toFactor;

            outputValue.value = Number(result.toPrecision(8)).toString();
        }

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                populateUnits(currentCategory);
                convert();
            });
        });

        swapBtn.addEventListener('click', () => {
            const fromIdx = fromUnitSelect.selectedIndex;
            const toIdx = toUnitSelect.selectedIndex;
            fromUnitSelect.selectedIndex = toIdx;
            toUnitSelect.selectedIndex = fromIdx;
            convert();
        });

        [inputValue, fromUnitSelect, toUnitSelect].forEach(el => el.addEventListener('input', convert));

        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            htmlElement.classList.add('light');
            themeIcon.className = 'fa-solid fa-sun';
        } else {
            htmlElement.classList.remove('light');
            themeIcon.className = 'fa-solid fa-moon';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('light')) {
                htmlElement.classList.remove('light');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.add('light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            }
        });

        // Init
        populateUnits(currentCategory);
        convert();
    </script>
</body>
</html>
