<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Naveen Siriwardhana</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0a192f;
            --text-main: #ffffff;
            --text-sub: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --grid-color: rgba(16, 185, 129, 0.05);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .animate-float { animation: float 5s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_2px_2px,var(--grid-color)_1px,transparent_0)] bg-[size:30px_30px]">

    <div class="max-w-md w-full glass-card rounded-3xl p-8 text-center relative overflow-hidden">
        <div class="absolute -top-12 -left-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl animate-float"></div>
        <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl animate-float" style="animation-delay: 2s"></div>

        <div class="inline-flex p-4 rounded-2xl bg-emerald-500/10 text-emerald-400 text-3xl mb-4">
            <i class="fa-solid fa-plug-circle-xmark"></i>
        </div>

        <h1 class="text-6xl font-black tracking-tight mb-2 text-emerald-400 mono">404</h1>
        <h2 class="text-xl font-bold mb-3" style="color: var(--text-main);">Page Not Found</h2>
        <p class="text-sm mb-8" style="color: var(--text-muted);">
            ඔයා හොයන Page එක තියෙන්නෙ නෑ, delete වෙලා තියෙන්න පුළුවන් නැත්නම් link එක වැරදිලා. <br>
            <span class="text-xs mono uppercase tracking-wider text-emerald-400/70 mt-2 block">// Connection to this route timed out</span>
        </p>

        <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold text-sm rounded-xl transition-all shadow-lg shadow-emerald-500/10">
            <i class="fa-solid fa-house"></i> Back to Portfolio
        </a>
    </div>

</body>
</html>
