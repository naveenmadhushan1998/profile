<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer | Naveen Siriwardhana</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">

    <style>
        :root {
            --bg-color: #0a192f;
            --text-main: #ffffff;
            --text-sub: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --inner-box: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(16, 185, 129, 0.05);
            --input-bg: rgba(10, 25, 47, 0.7);
        }

        html.light {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(15, 23, 42, 0.08);
            --inner-box: rgba(15, 23, 42, 0.04);
            --grid-color: rgba(16, 185, 129, 0.08);
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }

        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, var(--grid-color) 1px, transparent 0);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="grid-bg min-h-screen py-12 px-4 md:px-8">

    <div class="max-w-xl mx-auto container">

        <!-- Navigation & Theme Toggle -->
        <div class="flex justify-between items-center mb-8">
            <a href="index.html" class="glass-card px-4 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Profile
            </a>
            <button id="theme-toggle" class="glass-card p-3 rounded-xl text-emerald-400 hover:text-emerald-300 focus:outline-none cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>

        <!-- Tool Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-3xl text-emerald-400"><i class="fa-solid fa-hourglass-half"></i></span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-main);">Custom Event Countdown</h1>
                    <p class="text-xs mono uppercase tracking-wider text-emerald-400">// Count down to any date & time</p>
                </div>
            </div>

            <hr class="border-emerald-500/10 mb-6">

            <!-- Inputs -->
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-main);">Event Name</label>
                    <input type="text" id="event-name" value="New Year 2027" placeholder="e.g. My Wedding Day" class="w-full p-3 rounded-xl border border-emerald-500/20 focus:border-emerald-400 focus:outline-none font-medium" style="background: var(--input-bg); color: var(--text-main);">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color: var(--text-main);">Target Date & Time</label>
                    <input type="datetime-local" id="event-datetime" class="w-full p-3 rounded-xl border border-emerald-500/20 focus:border-emerald-400 focus:outline-none mono" style="background: var(--input-bg); color: var(--text-main);">
                </div>
            </div>

            <!-- Countdown Display -->
            <div class="grid grid-cols-4 gap-2 md:gap-3 mb-6">
                <div class="p-3 md:p-4 rounded-xl text-center border border-emerald-500/10 bg-emerald-500/5">
                    <div id="out-days" class="text-2xl md:text-3xl font-extrabold text-emerald-400 mono">00</div>
                    <div class="text-[10px] uppercase tracking-wider font-semibold mt-1" style="color: var(--text-muted);">Days</div>
                </div>
                <div class="p-3 md:p-4 rounded-xl text-center border border-emerald-500/10 bg-emerald-500/5">
                    <div id="out-hours" class="text-2xl md:text-3xl font-extrabold text-emerald-400 mono">00</div>
                    <div class="text-[10px] uppercase tracking-wider font-semibold mt-1" style="color: var(--text-muted);">Hours</div>
                </div>
                <div class="p-3 md:p-4 rounded-xl text-center border border-emerald-500/10 bg-emerald-500/5">
                    <div id="out-minutes" class="text-2xl md:text-3xl font-extrabold text-emerald-400 mono">00</div>
                    <div class="text-[10px] uppercase tracking-wider font-semibold mt-1" style="color: var(--text-muted);">Minutes</div>
                </div>
                <div class="p-3 md:p-4 rounded-xl text-center border border-emerald-500/10 bg-emerald-500/5">
                    <div id="out-seconds" class="text-2xl md:text-3xl font-extrabold text-emerald-400 mono">00</div>
                    <div class="text-[10px] uppercase tracking-wider font-semibold mt-1" style="color: var(--text-muted);">Seconds</div>
                </div>
            </div>

            <div id="status-msg" class="p-4 rounded-xl text-center border border-emerald-500/5" style="background: var(--inner-box);">
                <p id="status-text" class="text-sm font-semibold" style="color: var(--text-main);">Counting down...</p>
            </div>
        </div>
    </div>

    <script>
        const eventName = document.getElementById('event-name');
        const eventDatetime = document.getElementById('event-datetime');
        const outDays = document.getElementById('out-days');
        const outHours = document.getElementById('out-hours');
        const outMinutes = document.getElementById('out-minutes');
        const outSeconds = document.getElementById('out-seconds');
        const statusText = document.getElementById('status-text');

        let intervalId = null;

        function setDefaultDate() {
            const nextYear = new Date().getFullYear() + 1;
            const defaultDate = new Date(nextYear, 0, 1, 0, 0);
            const pad = (n) => n.toString().padStart(2, '0');
            const formatted = `${defaultDate.getFullYear()}-${pad(defaultDate.getMonth() + 1)}-${pad(defaultDate.getDate())}T${pad(defaultDate.getHours())}:${pad(defaultDate.getMinutes())}`;
            eventDatetime.value = formatted;
        }

        function updateCountdown() {
            const targetDate = new Date(eventDatetime.value);
            const now = new Date();
            const diff = targetDate - now;

            if (isNaN(targetDate.getTime())) {
                statusText.textContent = "Please select a valid date & time.";
                return;
            }

            if (diff <= 0) {
                outDays.textContent = "00";
                outHours.textContent = "00";
                outMinutes.textContent = "00";
                outSeconds.textContent = "00";
                statusText.innerHTML = `🎉 <span class="text-emerald-400 font-bold">${eventName.value || 'The event'}</span> has arrived!`;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            outDays.textContent = days.toString().padStart(2, '0');
            outHours.textContent = hours.toString().padStart(2, '0');
            outMinutes.textContent = minutes.toString().padStart(2, '0');
            outSeconds.textContent = seconds.toString().padStart(2, '0');

            statusText.innerHTML = `Counting down to <span class="text-emerald-400 font-bold">${eventName.value || 'your event'}</span>`;
        }

        eventName.addEventListener('input', updateCountdown);
        eventDatetime.addEventListener('input', updateCountdown);

        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            htmlElement.classList.add('light');
            themeIcon.className = 'fa-solid fa-sun';
        } else {
            htmlElement.classList.remove('light');
            themeIcon.className = 'fa-solid fa-moon';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('light')) {
                htmlElement.classList.remove('light');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.add('light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            }
        });

        // Init
        setDefaultDate();
        updateCountdown();
        intervalId = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
