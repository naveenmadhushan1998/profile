<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan / EMI Calculator | Naveen Siriwardhana</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">

    <style>
        :root {
            --bg-color: #0a192f;
            --text-main: #ffffff;
            --text-sub: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --inner-box: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(16, 185, 129, 0.05);
            --input-bg: rgba(10, 25, 47, 0.7);
        }

        html.light {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(15, 23, 42, 0.08);
            --inner-box: rgba(15, 23, 42, 0.04);
            --grid-color: rgba(16, 185, 129, 0.08);
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }

        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, var(--grid-color) 1px, transparent 0);
            background-size: 30px 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            height: 6px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            border: 3px solid #0a192f;
        }
    </style>
</head>
<body class="grid-bg min-h-screen py-12 px-4 md:px-8">

    <div class="max-w-2xl mx-auto container">

        <!-- Navigation & Theme Toggle -->
        <div class="flex justify-between items-center mb-8">
            <a href="index.html" class="glass-card px-4 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Profile
            </a>
            <button id="theme-toggle" class="glass-card p-3 rounded-xl text-emerald-400 hover:text-emerald-300 focus:outline-none cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>

        <!-- Tool Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-3xl text-emerald-400"><i class="fa-solid fa-hand-holding-dollar"></i></span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-main);">Loan / EMI Calculator</h1>
                    <p class="text-xs mono uppercase tracking-wider text-emerald-400">// Housing, Vehicle & Personal Loans</p>
                </div>
            </div>

            <hr class="border-emerald-500/10 mb-6">

            <!-- Inputs -->
            <div class="space-y-5 mb-6">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold" style="color: var(--text-main);">Loan Amount</label>
                        <span id="loan-amount-label" class="text-sm font-bold text-emerald-400 mono">LKR 2,000,000</span>
                    </div>
                    <input type="range" id="loan-amount" min="50000" max="30000000" step="10000" value="2000000" class="w-full">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold" style="color: var(--text-main);">Interest Rate (Annual %)</label>
                        <span id="interest-rate-label" class="text-sm font-bold text-emerald-400 mono">12%</span>
                    </div>
                    <input type="range" id="interest-rate" min="1" max="30" step="0.25" value="12" class="w-full">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold" style="color: var(--text-main);">Loan Term (Years)</label>
                        <span id="loan-term-label" class="text-sm font-bold text-emerald-400 mono">5 Years</span>
                    </div>
                    <input type="range" id="loan-term" min="1" max="30" step="1" value="5" class="w-full">
                </div>
            </div>

            <!-- Result -->
            <div class="p-6 rounded-2xl border border-emerald-500/20 text-center relative overflow-hidden bg-gradient-to-br from-emerald-500/5 to-transparent mb-6">
                <p class="text-xs uppercase tracking-widest text-emerald-400 font-bold mb-2">Monthly Installment (EMI)</p>
                <div id="emi-result" class="text-3xl md:text-4xl font-extrabold tracking-tight my-2 text-emerald-400 mono">
                    LKR 0.00
                </div>
            </div>

            <!-- Breakdown -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="p-4 rounded-xl text-center" style="background: var(--inner-box);">
                    <p class="text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-1">Principal</p>
                    <p id="out-principal" class="font-bold mono text-sm" style="color: var(--text-main);">0.00</p>
                </div>
                <div class="p-4 rounded-xl text-center" style="background: var(--inner-box);">
                    <p class="text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-1">Total Interest</p>
                    <p id="out-interest" class="font-bold mono text-sm text-amber-400">0.00</p>
                </div>
                <div class="p-4 rounded-xl text-center" style="background: var(--inner-box);">
                    <p class="text-[11px] uppercase tracking-wider font-semibold text-slate-400 mb-1">Total Payment</p>
                    <p id="out-total" class="font-bold mono text-sm text-emerald-400">0.00</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loanAmount = document.getElementById('loan-amount');
        const interestRate = document.getElementById('interest-rate');
        const loanTerm = document.getElementById('loan-term');

        const loanAmountLabel = document.getElementById('loan-amount-label');
        const interestRateLabel = document.getElementById('interest-rate-label');
        const loanTermLabel = document.getElementById('loan-term-label');

        const emiResult = document.getElementById('emi-result');
        const outPrincipal = document.getElementById('out-principal');
        const outInterest = document.getElementById('out-interest');
        const outTotal = document.getElementById('out-total');

        const formatLKR = (num) => "LKR " + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        function calculateEMI() {
            const P = parseFloat(loanAmount.value) || 0;
            const annualRate = parseFloat(interestRate.value) || 0;
            const years = parseFloat(loanTerm.value) || 0;

            const r = (annualRate / 100) / 12;
            const n = years * 12;

            let emi = 0;
            if (r === 0) {
                emi = P / n;
            } else {
                emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            }

            const totalPayment = emi * n;
            const totalInterest = totalPayment - P;

            loanAmountLabel.textContent = "LKR " + P.toLocaleString('en-US');
            interestRateLabel.textContent = annualRate + "%";
            loanTermLabel.textContent = years + (years == 1 ? " Year" : " Years");

            emiResult.textContent = formatLKR(emi);
            outPrincipal.textContent = formatLKR(P);
            outInterest.textContent = formatLKR(totalInterest);
            outTotal.textContent = formatLKR(totalPayment);
        }

        [loanAmount, interestRate, loanTerm].forEach(el => el.addEventListener('input', calculateEMI));

        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            htmlElement.classList.add('light');
            themeIcon.className = 'fa-solid fa-sun';
        } else {
            htmlElement.classList.remove('light');
            themeIcon.className = 'fa-solid fa-moon';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('light')) {
                htmlElement.classList.remove('light');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.add('light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            }
        });

        calculateEMI();
    </script>
</body>
</html>
