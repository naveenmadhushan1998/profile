<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Naveen Siriwardhana</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">

    <style>
        :root {
            --bg-color: #0a192f;
            --text-main: #ffffff;
            --text-sub: #e2e8f0;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --inner-box: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(16, 185, 129, 0.05);
            --input-bg: rgba(10, 25, 47, 0.7);
        }

        html.light {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-sub: #334155;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(15, 23, 42, 0.08);
            --inner-box: rgba(15, 23, 42, 0.04);
            --grid-color: rgba(16, 185, 129, 0.08);
            --input-bg: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-sub);
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
        }

        .grid-bg {
            background-image: radial-gradient(circle at 2px 2px, var(--grid-color) 1px, transparent 0);
            background-size: 30px 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            height: 6px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            border: 3px solid #0a192f;
        }

        .toggle-switch input:checked + .toggle-bg {
            background-color: #10b981;
        }
        .toggle-switch input:checked + .toggle-bg:after {
            transform: translateX(100%);
            border-color: white;
        }
    </style>
</head>
<body class="grid-bg min-h-screen py-12 px-4 md:px-8">

    <div class="max-w-2xl mx-auto container">

        <!-- Navigation & Theme Toggle -->
        <div class="flex justify-between items-center mb-8">
            <a href="index.html" class="glass-card px-4 py-2 rounded-xl text-sm font-semibold text-emerald-400 hover:text-emerald-300 transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Profile
            </a>
            <button id="theme-toggle" class="glass-card p-3 rounded-xl text-emerald-400 hover:text-emerald-300 focus:outline-none cursor-pointer">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>

        <!-- Tool Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-xl">
            <div class="flex items-center gap-3 mb-6">
                <span class="text-3xl text-emerald-400"><i class="fa-solid fa-key"></i></span>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-main);">Password Generator</h1>
                    <p class="text-xs mono uppercase tracking-wider text-emerald-400">// Secure & Strength-Checked, 100% Client-Side</p>
                </div>
            </div>

            <hr class="border-emerald-500/10 mb-6">

            <!-- Password Output -->
            <div class="p-4 rounded-2xl border border-emerald-500/20 flex items-center gap-3 mb-3" style="background: var(--inner-box);">
                <span id="password-output" class="flex-1 mono text-lg md:text-xl font-bold break-all" style="color: var(--text-main);">-</span>
                <button id="copy-btn" class="w-10 h-10 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20 transition-all cursor-pointer shrink-0">
                    <i class="fa-regular fa-copy"></i>
                </button>
                <button id="regen-btn" class="w-10 h-10 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/20 transition-all cursor-pointer shrink-0">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>

            <!-- Strength Meter -->
            <div class="mb-8">
                <div class="w-full h-2 rounded-full overflow-hidden bg-slate-800/50 mb-1.5">
                    <div id="strength-bar" class="h-full transition-all duration-300" style="width: 0%; background: #ef4444;"></div>
                </div>
                <p id="strength-label" class="text-xs font-bold text-right uppercase tracking-wider" style="color: var(--text-muted);">-</p>
            </div>

            <!-- Options -->
            <div class="space-y-5 mb-6">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold" style="color: var(--text-main);">Password Length</label>
                        <span id="length-label" class="text-sm font-bold text-emerald-400 mono">16</span>
                    </div>
                    <input type="range" id="length-slider" min="4" max="64" step="1" value="16" class="w-full">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-between p-3 rounded-xl cursor-pointer" style="background: var(--inner-box);">
                        <span class="text-xs font-semibold" style="color: var(--text-sub);">Uppercase (A-Z)</span>
                        <input type="checkbox" id="opt-upper" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl cursor-pointer" style="background: var(--inner-box);">
                        <span class="text-xs font-semibold" style="color: var(--text-sub);">Lowercase (a-z)</span>
                        <input type="checkbox" id="opt-lower" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl cursor-pointer" style="background: var(--inner-box);">
                        <span class="text-xs font-semibold" style="color: var(--text-sub);">Numbers (0-9)</span>
                        <input type="checkbox" id="opt-numbers" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </label>
                    <label class="flex items-center justify-between p-3 rounded-xl cursor-pointer" style="background: var(--inner-box);">
                        <span class="text-xs font-semibold" style="color: var(--text-sub);">Symbols (!@#$)</span>
                        <input type="checkbox" id="opt-symbols" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </label>
                </div>
            </div>

            <button id="generate-btn" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-emerald-500/10">
                <i class="fa-solid fa-shield-halved"></i> Generate New Password
            </button>

            <p class="text-[11px] text-center mt-4" style="color: var(--text-muted);">
                <i class="fa-solid fa-lock text-emerald-400 mr-1"></i> Generated entirely in your browser. Nothing is sent or stored anywhere.
            </p>
        </div>
    </div>

    <script>
        const lengthSlider = document.getElementById('length-slider');
        const lengthLabel = document.getElementById('length-label');
        const optUpper = document.getElementById('opt-upper');
        const optLower = document.getElementById('opt-lower');
        const optNumbers = document.getElementById('opt-numbers');
        const optSymbols = document.getElementById('opt-symbols');
        const passwordOutput = document.getElementById('password-output');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLabel = document.getElementById('strength-label');
        const generateBtn = document.getElementById('generate-btn');
        const regenBtn = document.getElementById('regen-btn');
        const copyBtn = document.getElementById('copy-btn');

        const CHARSETS = {
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lower: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        function secureRandomInt(max) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        }

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            let charset = '';
            if (optUpper.checked) charset += CHARSETS.upper;
            if (optLower.checked) charset += CHARSETS.lower;
            if (optNumbers.checked) charset += CHARSETS.numbers;
            if (optSymbols.checked) charset += CHARSETS.symbols;

            if (charset === '') {
                passwordOutput.textContent = 'Select at least one character type';
                updateStrength(0);
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset[secureRandomInt(charset.length)];
            }

            passwordOutput.textContent = password;
            updateStrength(calculateStrength(password, length));
        }

        function calculateStrength(password, length) {
            let poolSize = 0;
            if (optUpper.checked) poolSize += 26;
            if (optLower.checked) poolSize += 26;
            if (optNumbers.checked) poolSize += 10;
            if (optSymbols.checked) poolSize += CHARSETS.symbols.length;

            if (poolSize === 0) return 0;

            const entropy = length * Math.log2(poolSize);
            return entropy;
        }

        function updateStrength(entropy) {
            let percent, color, label;
            if (entropy <= 0) {
                percent = 0; color = '#ef4444'; label = 'No Password';
            } else if (entropy < 40) {
                percent = 25; color = '#ef4444'; label = 'Weak';
            } else if (entropy < 60) {
                percent = 50; color = '#f59e0b'; label = 'Fair';
            } else if (entropy < 80) {
                percent = 75; color = '#10b981'; label = 'Strong';
            } else {
                percent = 100; color = '#059669'; label = 'Very Strong';
            }
            strengthBar.style.width = percent + '%';
            strengthBar.style.background = color;
            strengthLabel.textContent = label + ` (~${Math.round(entropy)} bits)`;
        }

        lengthSlider.addEventListener('input', () => {
            lengthLabel.textContent = lengthSlider.value;
            generatePassword();
        });

        [optUpper, optLower, optNumbers, optSymbols].forEach(el => el.addEventListener('change', generatePassword));
        generateBtn.addEventListener('click', generatePassword);
        regenBtn.addEventListener('click', generatePassword);

        copyBtn.addEventListener('click', () => {
            const text = passwordOutput.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const icon = copyBtn.querySelector('i');
                icon.className = 'fa-solid fa-check';
                setTimeout(() => { icon.className = 'fa-regular fa-copy'; }, 1200);
            });
        });

        // Theme Toggle Setup
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'dark';
        if (currentTheme === 'light') {
            htmlElement.classList.add('light');
            themeIcon.className = 'fa-solid fa-sun';
        } else {
            htmlElement.classList.remove('light');
            themeIcon.className = 'fa-solid fa-moon';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.classList.contains('light')) {
                htmlElement.classList.remove('light');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            } else {
                htmlElement.classList.add('light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            }
        });

        generatePassword();
    </script>
</body>
</html>
